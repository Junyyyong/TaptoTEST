import groovy.json.JsonOutput

// Run with -I from the Android Gradle build. Writes only to ignored local tools.
allprojects {
    afterEvaluate { project ->
        if (project.path == ':app') {
            tasks.register('writeReleaseDependencyList') {
                doLast {
                    def records = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
                        .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                        .collect { component -> [group: component.id.group, name: component.id.module, version: component.id.version] }
                    def output = new File(rootProject.projectDir, '../.android-tools/release-artifacts.json')
                    output.parentFile.mkdirs()
                    output.text = JsonOutput.prettyPrint(JsonOutput.toJson(records))
                    println "Recorded ${records.size()} release dependency components."
                }
            }
        }
    }
}
