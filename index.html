<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="./icon.svg" />
    <title>TAPtoTEST</title>
  </head>
  <body>
    <main id="app">
      <section class="screen studio-splash-screen" id="screen-studio-splash" aria-label="TapeeTepee studio">
        <img class="studio-splash-cover" src="./assets/brand/tapeetepee-open2-06.png" alt="TapeeTepee open studio" />
      </section>
      <section class="screen splash-screen hidden" id="screen-splash" aria-label="TAPtoTEST">
        <img class="splash-cover" id="product-cover" alt="TAPtoTEST" />
      </section>
      <section class="screen title-screen hidden" id="screen-title">
        <header class="brand-block">
          <h1 class="brand" id="title-heading" tabindex="-1"><img class="brand-mark" id="brand-mark" alt="TAPtoTEST" /></h1>
        </header>
        <nav class="mode-list" aria-label="Game modes">
          <button class="mode-btn" id="mode-unit"><span class="mode-name">PUZZLE</span><span class="mode-desc">Find every puzzle piece.</span></button>
          <button class="mode-btn" id="mode-montage"><span class="mode-name">PORTRAIT</span><span class="mode-desc">Find the matching face.</span></button>
          <button class="mode-btn" id="mode-memory"><span class="mode-name">POSITION</span><span class="mode-desc">Flip cards. Match pairs.</span></button>
        </nav>
        <div class="title-links">
          <button class="text-btn" id="btn-title-settings">Settings</button>
          <div class="title-music-slot">
            <button class="title-music-prompt hidden" id="btn-title-music" aria-label="Play background music">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"></path></svg>
              <span>Tap for music</span>
            </button>
          </div>
        </div>
      </section>

      <section class="screen pick-intro-screen hidden" id="screen-mode-intro" aria-labelledby="mode-intro-title">
        <header class="hud">
          <button class="icon-btn" id="btn-mode-intro-back" aria-label="Back to menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span class="icon-spacer" aria-hidden="true"></span><span class="icon-spacer" aria-hidden="true"></span>
        </header>
        <div class="pick-intro-body">
          <h2 id="mode-intro-title"></h2>
          <div class="pick-intro-mark" id="mode-intro-mark" aria-hidden="true"></div>
          <p id="mode-intro-note"></p>
          <button class="wood-btn" id="btn-mode-intro-start">START</button>
        </div>
      </section>
      <section class="screen talk-screen pick-screen hidden" id="screen-game" tabindex="-1">
        <header class="hud">
          <button class="icon-btn" id="btn-back" aria-label="Back to menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <div class="run-heading"><span id="run-mode">Puzzle</span><strong id="run-clock">00:00.0</strong><div id="run-lives" class="life-meter hidden" role="img" aria-label="5 of 5 lives remaining" aria-live="polite"></div></div>
          <button class="icon-btn pause-btn" id="btn-pause" aria-label="Pause"><span aria-hidden="true"></span></button>
        </header>
        <section class="pick-target" aria-live="polite"><p class="target-character-name hidden" id="target-character-name"></p><div class="target-preview" id="target-preview"></div></section>
        <div class="pick-progress"><span id="progress-label">0 / 0</span><div class="progress-track"><i id="progress-fill"></i></div></div>
        <div class="picture-board picture-board--7" id="picture-board" aria-label="Picture puzzle board"></div>
        <p id="montage-status" class="montage-status hidden" aria-live="polite"></p>
        <div id="pick-moment" class="pick-moment" role="status" aria-live="polite"></div>
      </section>

      <section class="screen settings-screen hidden" id="screen-settings" aria-labelledby="settings-title">
        <header class="hud">
          <button class="icon-btn" id="btn-settings-back" aria-label="Back to menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-linejoin="round" /></svg></button>
          <h2 class="settings-title" id="settings-title">SETTINGS</h2>
          <span class="icon-spacer" aria-hidden="true"></span>
        </header>
        <div class="settings-body">
          <div id="settings-body"></div>
          <p class="settings-note" id="settings-note"></p>
          <nav class="settings-links" aria-label="Legal information">
            <button class="settings-legal-link" id="btn-privacy">Privacy policy</button>
            <span aria-hidden="true">·</span>
            <button class="settings-legal-link" id="btn-licenses">Licenses</button>
          </nav>
        </div>
      </section>
      <div id="damage-flash" class="damage-flash" aria-hidden="true"></div>
      <div class="cheer hidden" id="cheer" aria-hidden="true">
        <div class="cheer-card" id="cheer-card"><p class="cheer-headline" id="cheer-headline">COMPLETE</p><p class="cheer-score-label" id="cheer-score-label">SCORE</p><p class="cheer-score" id="cheer-score">0</p></div>
        <div class="cheer-word" id="cheer-word">GREAT!</div>
        <video class="cheer-clip hidden" id="cheer-clip" muted playsinline disablepictureinpicture preload="auto"></video>
        <audio id="cheer-sound" preload="auto"></audio>
        <p class="cheer-tap" id="cheer-tap">Tap to continue</p>
        <button class="text-btn cheer-continue" id="btn-cheer-continue">Continue</button>
      </div>
      <div class="result-layer hidden" id="result-layer" role="dialog" aria-modal="true">
        <div class="result-panel"><p class="result-kicker" id="result-kicker">YOUR RUN</p><h2 id="result-title">Complete!</h2><div id="result-metrics"></div><p id="result-detail"></p><p id="result-next-goal"></p><button class="wood-btn" id="btn-again">Play again</button><button class="text-btn" id="btn-result-menu">Home</button></div>
      </div>
      <div class="help-layer hidden" id="help-layer" role="dialog" aria-modal="true" aria-labelledby="help-title">
        <section class="help-panel"><header class="help-head"><button class="icon-btn" id="btn-help-close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><h2 id="help-title">How to play</h2><span class="icon-spacer" aria-hidden="true"></span></header><div class="help-body" id="help-body"></div></section>
      </div>
    </main>
    <dialog class="legal-dialog" id="legal-dialog" aria-labelledby="legal-title">
      <header class="legal-dialog-header">
        <h2 id="legal-title">Privacy policy</h2>
        <button id="btn-legal-close" aria-label="Close legal information" autofocus>Close</button>
      </header>
      <iframe id="legal-frame" title="Privacy policy" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
